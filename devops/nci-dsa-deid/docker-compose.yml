services:
  girder:
    # Image from Docker Hub; build and push with ./build_and_push.sh (from repo root)
    image: "${DOCKER_NAMESPACE:-dagutman}/nci-dsa-deid:latest"
    #build:
    #  context: .
    # Only have this on during dev
    # Instead of privileged mode, fuse can use:
    privileged: true
    # Set DSA_USER to a user id that is part of the docker group (e.g.,
    # `DSA_USER=$(id -u):$(id -g)`).  This makes files in assetstores and logs
    # owned by that user and provides permissions to manage docker

    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined

    environment:
      DSA_USER: ${DSA_USER:-} # Enable this to automatically use the provisioning yaml      
      DSA_PROVISION_YAML: ${DSA_PROVISION_YAML:-/opt/digital_slide_archive/devops/dsa/provision.yaml}
      # Optional: set to fix OAuth redirect_uri when proxy headers are wrong (e.g. 400 redirect_uri mismatch).
      # Use the exact callback URL your OAuth provider expects. Leave unset to use request headers.
      UNA_OAUTH_REDIRECT_URI: ${UNA_OAUTH_REDIRECT_URI:-}

      VITE_API_ROOT: /dsa/api/v1
      GIRDER_SERVER_MODE: development
      GIRDER_SETTING_SERVER_MODE: development
      api_root: /girder/api/v1
      static_public_path: /girder/static

    restart: unless-stopped
    # Set DSA_PORT to expose the interface on another port (default 8080).


    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${DSA_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nci-dsa-deid_assetstore:/assetstore
      - nci-dsa-deid_logs:/logs
    depends_on:
      - mongodb
      - memcached
      - rabbitmq
    command: /opt/digital_slide_archive/devops/dsa/start_girder.sh

  nginx:
    # Custom image with our nginx config; build and push with ./build_and_push.sh (from repo root)
    image: "${DOCKER_NAMESPACE:-dagutman}/nci-dsa-deid-nginx:latest"
    restart: unless-stopped
    environment:
      - REACT_BASE=/ # Make this match whatver PUBLIC_URL is set to in the react service. TODO: make nginx.conf use this env variable.
      # - USE_HTTPS=${USE_HTTPS:-} # If USE_HTTPS is defined and has any value, nginx will listen on port 443 and look for ssl certificate files
      # - SSL_CERT_FILE=${SSL_CERT_FILE:-certificate.cer} # the name of the certificate file (within services/nginx/ssl)
      # - SSL_KEY_FILE=${SSL_KEY_FILE:-certificate.key} # the name of the key file (within services/nginx/ssl)
    ports:
      - 8090:80 ## NGINX WILL BE ON PORT 8090 for this NCI STACK
      # - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"
    depends_on:
      - girder

  mongodb:
    image: "mongo:latest"
    # Set DSA_USER to your user id (e.g., `DSA_USER=$(id -u):$(id -g)`)
    # so that database files are owned by yourself.
    user: ${DSA_USER:-PLEASE SET DSA_USER}
    restart: unless-stopped
    # Using --nojournal means that changes can be lost between the last
    # checkpoint and an unexpected shutdown, but can substantially reduce
    # writes.
    #   Limiting maxConns reduces the amount of shared memory demanded by
    # mongo.  Remove this limit or increase the host vm.max_map_count value.
    command: --maxConns 1000 --logpath /var/log/mongodb/mongodb.log
    volumes:
      - ./db:/data/db
      - ./logs:/var/log/mongodb
    # Uncomment to allow access to the database from outside of the docker
    # network.
    # ports:
    #   - "27017"
    logging:
      options:
        max-size: "10M"
        max-file: "5"
  memcached:
    image: memcached
    command: -m 4096 --max-item-size 8M
    restart: unless-stopped
    # Uncomment to allow access to memcached from outside of the docker network
    # ports:
    #   - "11211"
    logging:
      options:
        max-size: "10M"
        max-file: "5"
  rabbitmq:
    image: "rabbitmq:latest"
    restart: unless-stopped
    # Uncomment to allow access to rabbitmq from outside of the docker network
    # ports:
    #   - "5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-}
    # rabbitmq.advanced.config must be in image if needed; no bind mount.
    logging:
      options:
        max-size: "10M"
        max-file: "5"
  worker:
    image: dsarchive/dsa_common
    # Set DSA_USER to a user id that is part of the docker group (e.g.,
    # `DSA_USER=$(id -u):$(id -g)`).  This provides permissions to manage
    # docker
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined

    environment:
      DSA_USER: ${DSA_USER:-}
      DSA_WORKER_CONCURRENCY: ${DSA_WORKER_CONCURRENCY:-2}
      TMPDIR:
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - rabbitmq
    command: /opt/digital_slide_archive/devops/dsa/start_worker.sh
    logging:
      options:
        max-size: "10M"
        max-file: "5"
  reactdeid:
    # Image from Docker Hub; build and push with ./build_and_push.sh (from repo root)
    image: "${DOCKER_NAMESPACE:-dagutman}/reactdeid:latest"
    working_dir: /home/reactdeid/app/
    restart: unless-stopped
    environment:
      - VITE_DSA_API_URL=http://girder:8080/api/v1
      - VITE_BASE_PATH=/deid/
      - VITE_HMR_HOST=wsi-deid.pathology.emory.edu
    ports:
      - "5173:5173"

  node:
    # Image from Docker Hub; build and push with ./build_and_push.sh (from repo root)
    image: "${DOCKER_NAMESPACE:-dagutman}/bdsa-node:0.0.1"
    user: "node"
    working_dir: /home/node/app/
    restart: unless-stopped
    environment:
      - MONGO_HOSTNAME=mongodb # this must match the name of the mongodb container
      - MONGO_PORT=27017 # this must be the port that the mongodb container listens on
    depends_on:
      - mongodb
    command: npm run start.dev

volumes:
  nci-dsa-deid_assetstore:
  nci-dsa-deid_logs:
