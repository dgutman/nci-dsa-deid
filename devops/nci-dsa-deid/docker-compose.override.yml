# docker-compose.override.yml
# This file is automatically loaded by docker-compose and overrides settings in docker-compose.yml
# Use this for local development to build images instead of pulling from registry
#
# For production/colleagues: Simply don't use this file (rename it or delete it)
# They will pull pre-built images from Docker Hub
#
# For local development: Keep this file to enable local building

services:
  girder:
    build:
      context: ../..  # Use repo root as context to access plugins/oauth
      dockerfile: devops/nci-dsa-deid/Dockerfile
    # Optionally mount local plugin for live development
    # volumes:
    #   - ../../plugins/oauth:/opt/girder/plugins/oauth

  nginx:
    build:
      context: ../../services/nginx
    # Mount config files for live development (changes reflect immediately after reload)
    volumes:
      - ../../services/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../../services/nginx/redirect_http.conf:/etc/nginx/conf.d/redirect_http.conf
      - ../../services/nginx/use_https.conf:/etc/nginx/conf.d/use_https.conf
      - ../../services/nginx/index.html:/etc/nginx/html/index.html

  reactdeid:
    build:
      context: ../../services/reactdeid
      args:
        - NODE_ENV=development
    # Mount source code for live development (changes reflect immediately)
    volumes:
      - ../../services/reactdeid:/home/reactdeid/app/
      - /home/reactdeid/app/node_modules/
