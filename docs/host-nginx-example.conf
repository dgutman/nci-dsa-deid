# Example host nginx config for wsi-deid.pathology.emory.edu
# Place this in /etc/nginx/sites-available/ (or similar) on the host that runs Docker.
#
# Important: use Host $host (the client's request host), not Host $proxy_host.
# Otherwise the container receives Host: localhost and Girder redirects back to localhost.

server {
    server_name wsi-deid.pathology.emory.edu;
    client_max_body_size 500M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # Preserve the original host so the container and Girder use wsi-deid.pathology.emory.edu for redirects
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://localhost:8090/;
        # Rewrite any backend redirect to localhost so the client stays on this host (fixes cached/wrong 301s)
        proxy_redirect http://localhost:8090/ $scheme://$host/;
        proxy_redirect http://localhost/ $scheme://$host/;
        proxy_redirect https://localhost:8090/ $scheme://$host/;
        proxy_redirect https://localhost/ $scheme://$host/;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Serve DryadData files
    location /dryad/ {
        alias /localRAID/DryadData/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        location ~* \.(zip|ZIP)$ {
            add_header Content-Disposition "attachment";
            add_header Content-Type "application/zip";
        }
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/DVcert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DVcert/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
