worker_processes 1;

events { worker_connections 1024; }

error_log  /var/log/nginx/error.log debug;

http {
        # include /etc/nginx/conf.d/envvar.conf;

        sendfile off;
        proxy_max_temp_file_size 0;
        proxy_buffering off;
        client_max_body_size 100m;

        upstream docker-node {
                server node:8080;
        }
        upstream docker-dsa{
                server girder:8080;
        }
        upstream docker-dashdeid {
                server dashdeid:8050;
        }
        # upstream docker-react {
        #         server react:8082;
        # }
        # upstream docker-dbview {
        #         server dbview:8081;
        # }

        # server {
        #         listen 80 default_server;

        #         server_name _;

        #         return 301 https://$host$request_uri;
        # }


        include /etc/nginx/conf.d/redirect_http.conf;


        server {
                listen 80;
                include /etc/nginx/conf.d/use_https.conf; # If this is enabled via enviroment variable, the server will also listen on https

                server_name _;

                
                # Easter egg for testing
                location ~* ^/oppan(?:/.*|$) { 
                        return 200 'Gangnam style!';
                        add_header Content-Type text/plain;
                }


                # Temporary fix:
                # Pass /api/v1/describe to docker-dsa upstream (girder service)
                location ~* ^/api/v1/describe(?:/.*|$) { 
                        proxy_pass http://docker-dsa;            
                }

                # Pass /api and subroutes along to the docker-node upstream (node service; expressjs API server)
                location ~* ^/api(?:/.*|$) { 
                        rewrite ^/api/*(.*)$ /$1 break;
                        proxy_pass http://docker-node;
                        proxy_redirect     off;
                        proxy_set_header   Host $host;
                        proxy_set_header   X-Real-IP $remote_addr;
                        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header   X-Forwarded-Host $server_name;
                        proxy_set_header   Cookie $http_cookie;
                }

                # Pass /api and subroutes along to the docker-node upstream (node service; expressjs API server)
                # location ~* ^/mongodb(?:/.*|$) { 
                #         proxy_pass http://docker-dbview;
                #         proxy_redirect     off;
                #         proxy_set_header   Host $host;
                #         proxy_set_header   X-Real-IP $remote_addr;
                #         proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                #         proxy_set_header   X-Forwarded-Host $server_name;
                #         proxy_set_header   Cookie $http_cookie;
                # }

                # Pass /dsa to docker-dsa upstream (girder service)
                location ~* ^/dsa(?:/.*|$) { 
                        rewrite ^/dsa/*(.*)$ /$1 break;
                        proxy_pass http://docker-dsa;

                        proxy_set_header Host $proxy_host; # If girder.cfg tools.proxy.on = False, this needs to be $http_host/dsa; otherwise, it can be $proxy_host
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Host $http_host/dsa; # If girder.cfg tools.proxy.on = True, this needs to be set to $http_host/dsa
                        proxy_set_header X-Forwarded-Proto $scheme;
                       
                        # Must set the following for SSE notifications to work
                        proxy_buffering off;
                        proxy_cache off;
                        proxy_set_header Connection '';
                        proxy_http_version 1.1;
                        chunked_transfer_encoding off;
                        proxy_read_timeout 600s;
                        proxy_send_timeout 600s;
                        # proxy_request_buffering option only works on nginx >= 1.7.11
                        # but is necessary to support streaming requests
                        proxy_request_buffering off;
                        
                }

                # Temporary fix:
                # Pass /plugin_static to docker-dsa upstream (girder service)
                location ~* ^/plugin_static(?:/.*|$) { 
                        proxy_pass http://docker-dsa;            
                }

                # Pass /deid to docker-dashdeid upstream (dashdeid service - Dash app)
                location ~* ^/deid(?:/.*|$) {
                        # Note: The Dash app is already configured with url_base_pathname=/deid/
                        # so we pass the full path including /deid
                        proxy_pass http://docker-dashdeid;
                        
                        proxy_set_header Host $http_host;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_set_header X-Real-IP $remote_addr;
                        
                        # WebSocket support for Dash callbacks
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                        proxy_read_timeout 86400;
                }

                


                # Pass /ws to docker-react upstream (react service)
                # location = /ws {
                #         proxy_pass http://docker-react;
                #         proxy_http_version 1.1;
                #         proxy_set_header Upgrade $http_upgrade;
                #         proxy_set_header Connection "upgrade";
                #         proxy_read_timeout 86400;
                # }

                # Pass / (root) to the docker-react upstream (react service)
                # location ~* ^/(?:/.*|$)? {
                #         proxy_pass http://docker-react;
                # }
                
                # Fallback route - show a simple status page
                location / {
                        return 200 'NCI DSA DeID Stack is running!\n\nAvailable services:\n- /dsa - Digital Slide Archive\n- /api - Node.js API (Hello World)\n- /deid - DeID Dashboard\n';
                        add_header Content-Type text/plain;
                }

        }


        

}

