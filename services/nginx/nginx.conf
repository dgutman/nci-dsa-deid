worker_processes 1;

events { worker_connections 1024; }

error_log /var/log/nginx/error.log debug;

http {
    # WebSocket connection upgrade (only upgrade if Upgrade header is present)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Canonical external host/scheme from the outer proxy (if present)
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ""      $host;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # When the request reaches nginx with Host: localhost (e.g. behind a proxy that doesn't set
    # X-Forwarded-Host), override so Girder/DSA redirects use the public host instead of localhost.
    # Set this to your public hostname so /dsa links and OAuth redirects stay on the right domain.
    map $host $public_host_override {
        default "";
        localhost "wsi-deid.pathology.emory.edu";
        "~^127\\." "wsi-deid.pathology.emory.edu";
    }
    map $public_host_override $final_forwarded_host {
        ""      $forwarded_host;
        default $public_host_override;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    proxy_max_temp_file_size 0;
    client_max_body_size 500m;

    upstream docker-node {
        server node:8080;
        keepalive 32;
    }

    upstream docker-dsa {
        server girder:8080;
        keepalive 32;
        keepalive_timeout 300s;
        keepalive_requests 1000;
    }

    upstream docker-reactdeid {
        server reactdeid:5173;
        keepalive 16;
    }

    include /etc/nginx/conf.d/redirect_http.conf;

    server {
        listen 80;
        include /etc/nginx/conf.d/use_https.conf;
        server_name _;

        # -------------------------
        # Static landing page at /
        # -------------------------
        # IMPORTANT: point this at the directory where you mount index.html inside the container.
        # If your compose mounts your html into /etc/nginx/html, keep this.
        root /etc/nginx/html;
        index index.html;

        # Optional: avoid noise + permission issues for favicon if not present
        location = /favicon.ico { try_files /favicon.ico =204; }
        location = /robots.txt  { try_files /robots.txt  =204; }

        # Easter egg for testing
        location ~* ^/oppan(?:/.*|$) {
            return 200 'Gangnam style!';
            add_header Content-Type text/plain;
        }

        # -------------------------
        # DSA / Girder under /dsa/
        # -------------------------
        # Use absolute redirect so the browser never resolves to localhost (e.g. behind proxy)
        location = /dsa {
            return 301 $forwarded_proto://$final_forwarded_host/dsa/;
        }

        location ^~ /dsa/ {
            rewrite ^/dsa/(.*)$ /$1 break;
            proxy_pass http://docker-dsa;

            # Make upstream see the external host/scheme (OAuth-safe; use final_forwarded_host so localhost is overridden)
            proxy_set_header Host              $final_forwarded_host;
            proxy_set_header X-Forwarded-Host  $final_forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP         $remote_addr;

            # Girder sees itself at root (we strip /dsa), so it may send Location: http://localhost:8080/...
            # Rewrite any localhost redirect to the public /dsa/ URL so the browser stays on wsi-deid
            proxy_redirect http://localhost:8080/ $forwarded_proto://$final_forwarded_host/dsa/;
            proxy_redirect http://localhost:8090/ $forwarded_proto://$final_forwarded_host/dsa/;
            proxy_redirect http://localhost/ $forwarded_proto://$final_forwarded_host/dsa/;
            proxy_redirect https://localhost:8080/ $forwarded_proto://$final_forwarded_host/dsa/;
            proxy_redirect https://localhost:8090/ $forwarded_proto://$final_forwarded_host/dsa/;
            proxy_redirect https://localhost/ $forwarded_proto://$final_forwarded_host/dsa/;
            proxy_redirect http://127.0.0.1:8080/ $forwarded_proto://$final_forwarded_host/dsa/;
            proxy_redirect http://127.0.0.1:8090/ $forwarded_proto://$final_forwarded_host/dsa/;
            proxy_redirect http://127.0.0.1/ $forwarded_proto://$final_forwarded_host/dsa/;

            # Keepalive + streaming/SSE
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # SSE compatibility (Girder notifications)
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
        }

        # Optional: keep your “temporary fix” paths, but make them consistent
        location ^~ /plugin_static/ {
            proxy_pass http://docker-dsa;

            proxy_set_header Host              $final_forwarded_host;
            proxy_set_header X-Forwarded-Host  $final_forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP         $remote_addr;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location ^~ /api/v1/describe {
            proxy_pass http://docker-dsa;

            proxy_set_header Host              $final_forwarded_host;
            proxy_set_header X-Forwarded-Host  $final_forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP         $remote_addr;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # -------------------------
        # Node API under /api/ (strip /api/)
        # -------------------------
        location ^~ /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://docker-node;

            proxy_redirect off;

            proxy_set_header Host              $forwarded_host;
            proxy_set_header X-Forwarded-Host  $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP         $remote_addr;

            proxy_set_header Cookie $http_cookie;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # -------------------------
        # React/Vite app under /deid/
        # -------------------------
        location = /deid {
            return 301 $forwarded_proto://$final_forwarded_host/deid/;
        }

        location ^~ /deid/ {
            proxy_pass http://docker-reactdeid;

            proxy_set_header Host              $forwarded_host;
            proxy_set_header X-Forwarded-Host  $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP         $remote_addr;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 86400;
        }

        # -------------------------
        # Static fallback for everything else (landing page at /)
        # -------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Content-Type text/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            # Inject public origin so links in index.html use the proxy host (wsi-deid...), not localhost
            sub_filter '__PUBLIC_ORIGIN__' '$forwarded_proto://$final_forwarded_host';
            sub_filter_once off;
        }
        location = /index.html {
            try_files $uri =404;
            add_header Content-Type text/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            sub_filter '__PUBLIC_ORIGIN__' '$forwarded_proto://$final_forwarded_host';
            sub_filter_once off;
        }
    }
}
